[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "content-foundry-agents"
version = "0.1.0"
description = "Multi-agent system for automated text content creation with Human-in-the-Loop control. Customise prompts to target any audience, topic, channel or format."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["langgraph", "ai-agents", "langchain", "llm", "content", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.2.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

# ---------------------------------------------------------------------------
# Dev dependencies — installed with: uv sync --group dev
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pip>=24.0",       # makes `pip` available inside the venv
    "ruff>=0.4.0",     # linter + formatter
    "pyright>=1.1.0",  # type checker
]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Ruff config
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Pyright config
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
